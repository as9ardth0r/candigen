name: Generate data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Boucle de découverte quotidienne (03:00 UTC). GitHub désactive
    # automatiquement les schedules après 60 jours SANS AUCUN push sur le
    # dépôt — comme ce workflow committe lui-même le hall of fame chaque
    # jour (étape "Persistance..." ci-dessous), le dépôt reste actif.
    - cron: "0 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

# N'autorise qu'un seul déploiement concurrent, sans annuler les runs en cours,
# mais met en file d'attente les runs les plus récents après ceux déjà en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installation d'Open Babel (conversion PDB -> PDBQT du récepteur)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbabel

      - name: Installation des dépendances Python
        run: pip install -r requirements.txt

      - name: Préparation du récepteur EGFR (une seule fois, si absent)
        # Télécharge la structure PDB 1M17 depuis RCSB et prépare le PDBQT
        # — le runner GitHub a un accès internet complet (contrairement à
        # certains environnements de développement restreints), donc ce
        # téléchargement fonctionne directement ici. Une fois committé par
        # l'étape de persistance ci-dessous, les runs suivants sautent
        # cette étape.
        run: |
          if [ ! -f data/receptor/config.json ]; then
            python scripts/prepare_receptor.py
          else
            echo "Récepteur déjà préparé (data/receptor/config.json présent) — skip."
          fi

      - name: Exécution du pipeline (génération + filtrage + export JSON/CSV + docking)
        run: python scripts/run_pipeline.py

      - name: Installation des dépendances de rétrosynthèse
        run: pip install -r requirements-retrosynthesis.txt

      - name: Cache des données AiZynthFinder (modèle USPTO + stock ZINC)
        # Contrairement à data/receptor/ (committé), ce modèle (plusieurs
        # centaines de Mo) n'est PAS committé dans le dépôt — mis en cache
        # entre les runs via actions/cache à la place. Premier run : cache
        # absent, téléchargement complet (~quelques minutes). Runs suivants :
        # cache restauré, téléchargement sauté entièrement.
        id: cache-aizynthfinder
        uses: actions/cache@v4
        with:
          path: aizynthfinder_data
          key: aizynthfinder-data-v1

      - name: Téléchargement des données AiZynthFinder (si cache absent)
        if: steps.cache-aizynthfinder.outputs.cache-hit != 'true'
        run: |
          mkdir -p aizynthfinder_data
          download_public_data ./aizynthfinder_data

      - name: Rétrosynthèse (AiZynthFinder) sur le top TPP du jour
        # Même logique de priorisation que le docking (top-K par fitness,
        # cf. MAX_DOCKING) — voir scripts/run_retrosynthesis.py. Écrit un
        # JSON par molécule dans site/data/retrosynthesis/ (comme
        # site/data/conformers.json : Pages ne sert que site/, pas data/
        # à la racine du dépôt).
        run: python scripts/run_retrosynthesis.py --config aizynthfinder_data/config.yml

      - name: Persistance du hall of fame (commit des données mises à jour)
        # [skip ci] dans le message empêche ce commit de redéclencher le
        # workflow via le trigger `push` (sinon boucle infinie). Les triggers
        # `schedule` et `workflow_dispatch` ne sont eux jamais affectés par
        # ce mot-clé — seul le prochain push, humain, en profite.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hall_of_fame.json data/explored.json data/last_run.json data/molecules.json data/molecules.csv data/receptor/ site/data/molecules.json site/data/conformers.json site/data/retrosynthesis/
          git diff --staged --quiet || git commit -m "chore: mise a jour quotidienne du hall of fame [skip ci]"
          git push

      - name: Upload de data/ comme artefact de build (traçabilité)
        uses: actions/upload-artifact@v4
        with:
          name: candigen-data
          path: |
            data/molecules.json
            data/molecules.csv

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload du site statique (dossier site/) pour Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
