<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CandiGen Dashboard — EGFR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/smiles-drawer@2/dist/smiles-drawer.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>CandiGen <span class="highlight">Dashboard</span></h1>
    <p class="lede">
      Pipeline CADD open source — génération & criblage d'inhibiteurs de EGFR
    </p>

    <div class="header-meta-box">
      <div id="footer-meta">EGFR · chargement…</div>
      <a href="https://github.com" target="_blank" rel="noopener" class="github-btn">Voir sur GitHub</a>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="candidates-panel">
    <div id="candidate-grid" class="candidate-grid"></div>
  </section>
</main>

<!-- Modal pour la Rétrosynthèse -->
<div id="retro-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <button class="modal-close" id="modal-close-btn">&times;</button>
    <div id="retro-container"></div>
  </div>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
